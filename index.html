<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b6656">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Signature">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" href="/icon-192.png">
<title>Signature Invoices</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@500;600&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-first app shell, bottom tab bar, stacked screens; invoice preview is a fixed A4 sheet scaled to fit */
:root{
  --bg:#f3f6f5; --surface:#ffffff; --fg:#1d2624; --muted:#5f6d69; --line:#d9e1df;
  --accent:#0b6656; --accent-ink:#ffffff; --accent-soft:#e1efeb;
  --ok:#1f7a3f; --ok-soft:#e2f2e7; --warn:#a15c00; --warn-soft:#fbefdc; --bad:#b3261e; --bad-soft:#fbe4e2;
  --info:#2f5f9e; --info-soft:#e3ecf8; --draft:#5f6d69; --draft-soft:#e9eeec;
  --bar-in:#0b6656; --bar-out:#c98a3a;
  --font-ui:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-script:"Great Vibes","Brush Script MT",cursive;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111816; --surface:#19221f; --fg:#e6eeeb; --muted:#9aaaa5; --line:#2c3935;
  --accent:#4fb8a2; --accent-ink:#0c1a17; --accent-soft:#1d3530;
  --ok:#6fcf8f; --ok-soft:#1b3324; --warn:#f0b462; --warn-soft:#3a2c17; --bad:#f2928a; --bad-soft:#3d1f1d;
  --info:#8db4ea; --info-soft:#1d2a3d; --draft:#9aaaa5; --draft-soft:#26302d;
  --bar-in:#4fb8a2; --bar-out:#e0a85e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111816; --surface:#19221f; --fg:#e6eeeb; --muted:#9aaaa5; --line:#2c3935;
  --accent:#4fb8a2; --accent-ink:#0c1a17; --accent-soft:#1d3530;
  --ok:#6fcf8f; --ok-soft:#1b3324; --warn:#f0b462; --warn-soft:#3a2c17; --bad:#f2928a; --bad-soft:#3d1f1d;
  --info:#8db4ea; --info-soft:#1d2a3d; --draft:#9aaaa5; --draft-soft:#26302d;
  --bar-in:#4fb8a2; --bar-out:#e0a85e; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:15px;line-height:1.45}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:14px 120px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-size:1.4rem;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.02rem;font-weight:700}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;min-height:40px}
.brandlogo{display:block;height:56px;width:auto;mix-blend-mode:multiply}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .brandlogo{filter:invert(1);mix-blend-mode:screen}}
:root[data-theme="dark"] .brandlogo{filter:invert(1);mix-blend-mode:screen}
.brand{font-family:var(--font-script);font-size:2rem;line-height:1;color:var(--accent)}
.sub{color:var(--muted);font-size:.85rem}
.label{font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.sect{margin:18px 0 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
button{font:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:var(--r);padding:10px 14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.danger.arm{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.small{padding:6px 11px;font-size:.85rem}
.btn:disabled{opacity:.55}
.link{border:0;background:none;color:var(--accent);font-weight:600;padding:0}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.row:focus-visible,.tile:focus-visible,.link:focus-visible,nav.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-align:left;color:inherit;min-width:0}
button.stat:hover{border-color:var(--accent)}
.stat b{display:block;font-size:1.25rem;font-variant-numeric:tabular-nums;margin:2px 0}
.stat.hero{grid-column:1/-1;background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stat.hero .label,.stat.hero .sub{color:inherit;opacity:.85}
.stat.hero b{font-size:1.7rem}
.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.quick .btn{justify-content:center;padding:12px 6px;font-size:.88rem}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.pill{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:99px;padding:5px 12px;font-size:.85rem;font-weight:600}
.pill[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.search{margin-bottom:10px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 12px;padding:12px 14px;border:0;border-bottom:1px solid var(--line);cursor:pointer;background:none;width:100%;text-align:left;color:inherit}
.row:last-child{border-bottom:0}
.row:hover{background:var(--accent-soft)}
.row .who{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .amt{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.row .meta{color:var(--muted);font-size:.84rem;font-variant-numeric:tabular-nums;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .meta.r{text-align:right}
.status{justify-self:end;font-size:.7rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:99px;padding:2px 8px;white-space:nowrap}
.st-draft{background:var(--draft-soft);color:var(--draft)}
.st-sent,.st-awaiting{background:var(--warn-soft);color:var(--warn)}
.st-part{background:var(--info-soft);color:var(--info)}
.st-overdue,.st-declined{background:var(--bad-soft);color:var(--bad)}
.st-paid,.st-accepted,.st-invoiced{background:var(--ok-soft);color:var(--ok)}
.empty{padding:26px 18px;text-align:center;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:12px;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:480px){.grid2.stack{grid-template-columns:minmax(0,1fr)}}
.field{display:grid;gap:4px;min-width:0}
input,select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:70px}
.item{border:1px solid var(--line);border-radius:8px;padding:10px;display:grid;gap:8px}
.item-nums{display:grid;grid-template-columns:minmax(0,1fr) 64px minmax(0,1fr) auto;gap:8px;align-items:end}
.item-amt{font-weight:700;padding:9px 0;text-align:right;font-variant-numeric:tabular-nums}
.pay-row{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:end}
@media (max-width:480px){.pay-row{grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto}.pay-row .pm{grid-column:1/3;grid-row:2}}
.icon-btn{border:0;background:none;color:var(--muted);padding:8px;border-radius:8px;font-size:1.05rem;line-height:1}
.icon-btn:hover{color:var(--bad);background:var(--bad-soft)}
.totals{display:grid;gap:4px;font-variant-numeric:tabular-nums}
.totals div{display:flex;justify-content:space-between;gap:10px}
.totals .big{font-size:1.12rem;font-weight:700;border-top:1px solid var(--line);padding-top:6px;margin-top:4px}
.check{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.check input[type=checkbox]{width:auto}
.notice{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:10px 12px;font-size:.88rem;margin-bottom:12px}
.info{background:var(--info-soft);color:var(--info);border-radius:8px;padding:10px 12px;font-size:.88rem}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:.92rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere;white-space:pre-line}
.qcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-align:left;color:inherit;display:grid;gap:3px;min-width:0}
.qcard:hover{border-color:var(--accent)}
.qcard.now{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.qcard .q{font-weight:700}
.qcard .ln{display:flex;justify-content:space-between;gap:8px;font-size:.86rem;font-variant-numeric:tabular-nums}
.qcard .ln.p{font-weight:700;font-size:.95rem;border-top:1px solid var(--line);padding-top:4px;margin-top:2px}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 10px 6px;overflow-x:auto}
.chart svg{display:block;width:100%;min-width:320px;height:auto}
.legend{display:flex;gap:14px;font-size:.8rem;color:var(--muted);padding:0 4px 6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
table.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.92rem}
table.tbl td{padding:7px 0;border-bottom:1px solid var(--line)}
table.tbl td.r{text-align:right;padding-left:12px;white-space:nowrap}
table.tbl tr.t td{font-weight:700;border-bottom:0}
.menu .row{grid-template-columns:auto minmax(0,1fr) auto;align-items:center}
.menu svg{width:22px;height:22px;color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:99px;font-weight:600;font-size:.9rem;z-index:30;max-width:calc(100% - 32px)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
nav.tabs button{flex:1;max-width:150px;border:0;background:none;color:var(--muted);padding:8px 2px 10px;font-weight:600;font-size:.72rem;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
.fab{position:fixed;right:16px;bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:21;border-radius:99px;padding:13px 20px;box-shadow:0 6px 18px rgba(0,0,0,.2)}
.seg{display:flex;border-bottom:1px solid var(--line);margin:0 0 14px}
.seg button{flex:1;border:0;background:none;color:var(--muted);font-weight:600;padding:10px 4px;font-size:.95rem;box-shadow:inset 0 -3px 0 transparent}
.seg button[aria-selected="true"]{color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent)}
.yearhead{display:flex;justify-content:space-between;padding:8px 14px;background:var(--bg);color:var(--muted);font-weight:600;font-size:.85rem;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.paidtxt{color:var(--ok);font-weight:600}
.hist{display:grid;gap:0}
.hist div{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 12px;padding:10px 0;border-bottom:1px solid var(--line)}
.hist .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);margin-top:5px;grid-row:span 2}
.hist .dot.pay{background:var(--ok)}
.actionbar{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:21;display:flex;justify-content:center;gap:8px;padding:10px 16px;background:var(--surface);border-top:1px solid var(--line)}
.actionbar .btn{flex:1;max-width:240px;justify-content:center}
.msgbox{width:100%;min-height:180px;font-size:.92rem}
.rcpts{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.rcpt{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg);display:grid;min-width:0}
.rcpt .thumb{height:120px;text-decoration:none;display:flex;align-items:center;justify-content:center;background:#fff;color:#555;font-weight:700;font-size:.8rem;overflow:hidden}
.rcpt .thumb img{width:100%;height:100%;object-fit:cover}
.rcpt .cap{display:flex;justify-content:space-between;align-items:center;gap:4px;padding:4px 6px;font-size:.75rem;color:var(--muted);min-width:0}
.rcpt .cap span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dropzone{border:2px dashed var(--line);border-radius:var(--r);padding:16px;text-align:center;display:grid;gap:8px;justify-items:center}
.dropzone.over{border-color:var(--accent);background:var(--accent-soft)}
.tag-ok{color:var(--ok);font-weight:600}.tag-miss{color:var(--warn);font-weight:600}
.sheet-frame{overflow:hidden;border-radius:6px;box-shadow:0 2px 14px rgba(0,0,0,.15);margin:0 auto}
.logo-preview{max-height:70px;max-width:200px;background:#fff;border-radius:6px;padding:4px}

/* The invoice paper copies Brad's original layout: US Letter at 96px/in (816 x 1056), Inter Medium, always light */
.sheet{width:816px;min-height:1056px;background:#fff;color:#454545;font-family:"Inter",Arial,sans-serif;font-weight:500;font-size:14px;line-height:21px;padding:0 40px 40px;position:relative;transform-origin:top left;-webkit-font-smoothing:antialiased}
.sheet .bar{height:4px;background:var(--brand,#00695c);margin:0 -40px}
.sh-head{display:grid;grid-template-columns:200px minmax(0,1fr) 220px;column-gap:25px;padding:21px 0 15px;border-bottom:1px solid #c9d5de}
.sh-logo{display:flex;align-items:center;justify-content:center;min-height:200px}
.sh-logo img{width:200px;height:auto;display:block}
.sh-logo .fallback{text-align:center}
.sh-logo .script{font-family:var(--font-script);font-size:52px;line-height:1;color:#111}
.sh-logo .tag{font-size:8px;letter-spacing:.42em;color:#222;margin-top:6px}
.sh-biz .name{font-size:20px;line-height:30px;color:#3d3d3d;margin:0 0 6px;max-width:250px}
.sh-biz .ln{line-height:26px}
.sh-meta{text-align:right}
.sh-meta .k{font-size:12px;line-height:16px;color:#333;text-transform:uppercase;margin-top:20px}
.sh-meta .k:first-child{margin-top:2px}
.sh-meta .v{line-height:20px;margin-top:6px}
.sh-bill{padding:16px 0 30px}
.sh-k{font-size:12px;line-height:16px;color:#333;text-transform:uppercase}
.sh-bill .name{font-size:18px;line-height:24px;color:#3d3d3d;margin:14px 0 9px}
.sh-bill .ln{line-height:26px;display:flex;align-items:center;gap:7px}
.sh-bill svg{width:9px;height:12px;flex:none}
.sh-table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.sh-table th{font-size:12px;font-weight:500;color:#333;text-align:left;padding:12px 0;line-height:16px;border-top:1px solid #000;border-bottom:1px solid #000}
.sh-table td{padding:8px 0 9px;font-size:14px;line-height:21px;color:#454545;vertical-align:top;white-space:pre-line;border-bottom:1px solid #bfbfbf}
.sh-table tbody tr:not(:last-child) td{border-bottom:1px dashed #cfcfcf}
.sh-table .r{text-align:right;white-space:nowrap}
.sh-table .c-rate{width:110px}.sh-table .c-qty{width:63px}.sh-table .c-amt{width:94px}
.sh-foot{display:grid;grid-template-columns:minmax(0,1fr) 368px;column-gap:20px;padding-top:15px}
.sh-pay .title{font-size:18px;line-height:24px;color:#3d3d3d;margin:15px 0 20px}
.sh-pay .sh-k{margin-bottom:6px}
.sh-tot{font-variant-numeric:tabular-nums}
.sh-tot .tr{display:flex;justify-content:space-between;align-items:baseline;height:26px}
.sh-tot .tr .sh-k{line-height:26px}
.sh-tot .rule{border-top:1px solid #bfbfbf;margin:4px 0 3px}
.sh-tot .due{text-align:right;padding-top:9px}
.sh-tot .due b{display:block;font-weight:600;font-size:18px;line-height:24px;color:#333;margin-top:10px}
.sh-tot .end{border-top:1px solid #bfbfbf;margin-top:11px}
.sh-notes{margin-top:30px}
.sh-notes div{min-height:21px}
.sh-thanks{margin-top:52px;font-size:12px;color:#9b9b9b}
#pdfHost{position:fixed;left:-10000px;top:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.login{max-width:380px;margin:12vh auto 0;display:grid;gap:14px}
.login img{max-width:260px;margin:0 auto 8px;display:block}
.login .err{color:var(--bad);font-size:.9rem;min-height:1.2em}
body{background:var(--bg)}
</style>
</head>
<body>

<div class="wrap" id="app"><div class="empty">Opening your books…</div></div>
<nav class="tabs" id="tabs">
  <button data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
  <button data-tab="clients"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6"/><path d="M16 4a4 4 0 0 1 0 8M22 21c0-3-1.5-5-4-5.7"/></svg>Clients</button>
  <button data-tab="quotes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>Quotes</button>
  <button data-tab="invoices"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>Invoices</button>
  <button data-tab="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Money</button>
</nav>
<div id="pdfHost"></div>
<div id="toastHost"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* ================= data & defaults ================= */
const DEFAULT_SETTINGS = {
  bizName:"Signature Bespoke decorating", owner:"Bradley Loubser",
  address:"", phone:"", email:"",
  payee:"", account:"", sortCode:"",
  invPrefix:"INV", quotePrefix:"QUO", vatOn:false, vatRate:20, dueDays:0, quoteDays:30,
  quarters:"standard", brandColor:"#00695c", logo:"/logo.png",
  notes:"Please note this estimate is labour only\nMaterials are for the clients account\nA 20% deposit will be required prior to commencement of works\nPayment for work completed is to be paid each Friday with the final balance due on completion of scheduled works\n\nTwo coats will be applied to all surfaces\nDecorating sheets and polythene sheets will be used to protect surfaces and furniture\nOnly trade quality paint will be used",
  thanks:"Thanks for your business!"
};
// HMRC self-employment expense categories (names follow the MTD quarterly update)
const CATS = [
  ["costOfGoods","Materials & stock"],
  ["cisPaymentsToSubcontractors","Subcontractors (CIS)"],
  ["staffCosts","Wages & staff"],
  ["travelCosts","Van, fuel & travel"],
  ["premisesRunningCosts","Rent, rates & power"],
  ["maintenanceCosts","Repairs & maintenance"],
  ["adminCosts","Phone, office & software"],
  ["advertisingCosts","Advertising & leads"],
  ["professionalFees","Accountant & legal"],
  ["financeCharges","Bank & card charges"],
  ["interestOnBankOtherLoans","Loan interest"],
  ["irrecoverableDebts","Bad debts written off"],
  ["businessEntertainmentCosts","Entertaining (not allowable)"],

function norm(i){
  if(!i) return i;
  if(i.type==="estimate") i.type="quote";
  if(!i.type) i.type="invoice";
  if(!Array.isArray(i.payments)) i.payments = (+i.paid>0) ? [{id:"p0",date:i.paidDate||i.date,amount:+i.paid,method:"Bank transfer"}] : [];
  if(!i.client) i.client={name:"",address:"",phone:"",email:""};
  if(!Array.isArray(i.items)) i.items=[];
  return i;
}
function totals(inv){
  const sub = (inv.items||[]).reduce((a,i)=>a+(Number(i.rate)||0)*(Number(i.qty)||0),0);
  const vat = inv.vatOn ? sub*(Number(inv.vatRate)||0)/100 : 0;
  const total = r2(sub+vat);
  const paid = inv.type==="quote" ? 0 : r2((inv.payments||[]).reduce((a,p)=>a+(Number(p.amount)||0),0));
  return {sub:r2(sub), vat:r2(vat), total, paid, due: r2(Math.max(0,total-paid))};
}
function statusOf(inv){
  if(inv.type==="quote"){
    if(inv.status==="accepted" && inv.convertedTo && S.invoices[inv.convertedTo]) return "invoiced";
    if(inv.status==="accepted") return "accepted";
    if(inv.status==="declined") return "declined";
    if(inv.status==="sent") return "awaiting";
    return "draft";
  }
  if(inv.status==="draft") return "draft";
  const t=totals(inv);
  if(t.total>0 && t.due<=0.004) return "paid";
  if(inv.due && inv.due < todayISO()) return "overdue";
  if(t.paid>0) return "part";
  return "sent";
}
const STATUS_LABEL={draft:"Draft",sent:"Unpaid",part:"Part paid",overdue:"Overdue",paid:"Paid",awaiting:"Awaiting reply",accepted:"Accepted",declined:"Declined",invoiced:"Invoiced"};

function nextNumber(type){
  const prefix = type==="quote" ? S.settings.quotePrefix : S.settings.invPrefix;
  let max=0;
  Object.values(S.invoices).forEach(i=>{ if((i.number||"").startsWith(prefix)){ const m=i.number.match(/(\d+)\s*$/); if(m) max=Math.max(max,+m[1]); }});
  return prefix + String(max+1).padStart(4,"0");
}

/* ---- tax years & MTD quarters ---- */
function taxYearOf(iso){ const y=+iso.slice(0,4), md=iso.slice(5); const start = S.settings.quarters==="calendar"?"04-01":"04-06"; return md>=start ? y : y-1; }
function quartersOf(Y){
  const n=Y+1;
  const q = S.settings.quarters==="calendar"
    ? [[`${Y}-04-01`,`${Y}-06-30`],[`${Y}-07-01`,`${Y}-09-30`],[`${Y}-10-01`,`${Y}-12-31`],[`${n}-01-01`,`${n}-03-31`]]
    : [[`${Y}-04-06`,`${Y}-07-05`],[`${Y}-07-06`,`${Y}-10-05`],[`${Y}-10-06`,`${n}-01-05`],[`${n}-01-06`,`${n}-04-05`]];
  const dl=[`${Y}-08-07`,`${Y}-11-07`,`${n}-02-07`,`${n}-05-07`];
  return q.map(([s,e],i)=>({n:i+1,start:s,end:e,deadline:dl[i],label:`Q${i+1}`}));
}
const tyLabel = Y => `${Y}–${String(Y+1).slice(2)}`;
function allPayments(){
  const out=[];
  Object.entries(S.invoices).forEach(([id,i])=>{ if(i.type!=="invoice"||i.status==="draft") return; (i.payments||[]).forEach(p=>{ if(p.date && +p.amount) out.push({...p, amount:+p.amount, invId:id, number:i.number, client:i.client?.name||"", clientId:i.clientId}); }); });
  return out;
}
const allExpenses = () => Object.entries(S.expenses).map(([id,e])=>({id,...e,amount:+e.amount||0}));
function periodFigures(start,end){
  const pays=allPayments().filter(p=>p.date>=start&&p.date<=end);
  const exps=allExpenses().filter(e=>e.date>=start&&e.date<=end);
  const income=r2(pays.reduce((a,p)=>a+p.amount,0));
  const byCat={}; exps.forEach(e=>{ byCat[e.category]=r2((byCat[e.category]||0)+e.amount); });
  const spent=r2(exps.reduce((a,e)=>a+e.amount,0));
  const allowable=r2(spent-(byCat.businessEntertainmentCosts||0));
  return {pays,exps,income,byCat,spent,allowable,profit:r2(income-allowable)};
}

async function fetchAll(table){

  for(let from=0;;from+=step){
    const {data,error}=await sb.from(table).select("*").range(from,from+step-1);
    if(error) throw error; out.push(...data); if(data.length<step) break;
  }
  return out;
}

async function put(col,id,data){
  const clean=JSON.parse(JSON.stringify(data));
  if(col==="settings"){
    S.settings={...DEFAULT_SETTINGS,...clean};
    chk(await sb.from("settings").upsert({owner_id:user.id,data:clean,updated_at:new Date().toISOString()}));
  } else if(col==="clients"){
    S.clients[id]=clean; chk(await sb.from("clients").upsert(clientToRow(id,clean)));
  } else if(col==="expenses"){
    S.expenses[id]=clean; chk(await sb.from("expenses").upsert(expToRow(id,clean)));
  } else if(col==="items"){
    S.items[id]=clean; chk(await sb.from("saved_items").upsert({id,description:clean.desc,rate:r2(clean.rate)}));
  } else if(col==="invoices"){
    const doc=norm(clean);
    doc.payments=(doc.payments||[]).filter(p=>p.date&&+p.amount).map(p=>({...p,id:payId(id,p),amount:r2(p.amount)}));
    chk(await sb.from("documents").upsert(docToRow(id,doc)));
    const keep=doc.payments.map(p=>p.id);
    let q=sb.from("payments").delete().eq("document_id",id);
    if(keep.length) q=q.not("id","in",`(${keep.map(k=>`"${k}"`).join(",")})`);
    chk(await q);
    if(doc.payments.length) chk(await sb.from("payments").upsert(doc.payments.map(p=>({id:p.id,document_id:id,date:p.date,amount:p.amount,method:p.method||"Bank transfer",note:p.note||""}))));
    S.invoices[id]=doc;
  }
}

}

  const invoiced=r2(invs.reduce((a,i)=>a+totals(i).total,0)), paid=r2(invs.reduce((a,i)=>a+totals(i).paid,0));

  return {mine,invs,invoiced,paid,owed:r2(invs.reduce((a,i)=>a+totals(i).due,0)),last,quotes:mine.filter(i=>i.type==="quote"),h,lifetime,jobs};
}

/* ================= QUOTES & INVOICES LISTS ================= */
function docList(app,type){
  const isQ=type==="quote", key=isQ?"quoteFilter":"invFilter";
  const filters = isQ ? [["all","All"],["awaiting","Awaiting"],["accepted","Confirmed"],["invoiced","Invoiced"],["declined","Declined"],["draft","Drafts"]]
                      : [["all","All"],["owed","Outstanding"],["paid","Paid"]];
  if(!filters.some(([k])=>k===ui[key])) ui[key]="all";
  const f=ui[key];
  let rows=docs(type).map(i=>({...i,_s:statusOf(i),_t:totals(i)}));
  rows=rows.filter(i=> f==="all" || (f==="owed" ? ["sent","part","overdue"].includes(i._s) : i._s===f));
  if(ui.q){ const q=ui.q.toLowerCase(); rows=rows.filter(i=>(i.number+" "+i.client.name+" "+i.items.map(x=>x.desc).join(" ")).toLowerCase().includes(q)); }
  rows.sort((a,b)=>b.date.localeCompare(a.date)||b.number.localeCompare(a.number));
  const years={}; rows.forEach(r=>{ const y=r.date.slice(0,4); (years[y]=years[y]||[]).push(r); });
  const lastPay=i=>(i.payments||[]).reduce((a,p)=>p.date>a?p.date:a,"");
  const right=i=>{
    if(!isQ && i._s==="paid") return `<span class="meta r paidtxt">Paid ${ukDate(lastPay(i))}</span>`;
    if(!isQ && i._s==="sent") return `<span class="meta r">${ukDate(i.date)}</span>`;
    return pill(i._s);
  };
  const amt=i=>!isQ&&f==="owed"?i._t.due:i._t.total;
  app.innerHTML=`
  <div class="top"><h1>${isQ?"Quotes":"Invoices"}</h1><button class="btn small" data-act="go" data-v="settings" aria-label="Settings">⚙ Settings</button></div>
  ${banner()}
  ${isQ?`<div class="pills">${filters.map(([k,l])=>`<button class="pill" data-f="${k}" aria-pressed="${f===k}">${l}</button>`).join("")}</div>`
       :`<div class="seg" role="tablist">${filters.map(([k,l])=>`<button role="tab" data-f="${k}" aria-selected="${f===k}">${l}</button>`).join("")}</div>`}
  <input class="search" id="doc-q" type="search" placeholder="Search client, number or work" value="${esc(ui.q)}">
  <div class="list">${loading("invoices")?`<div class="empty">Loading…</div>`:rows.length?Object.keys(years).sort().reverse().map(y=>`
    <div class="yearhead"><span>${y}</span><span>${money(years[y].reduce((a,i)=>a+amt(i),0))}</span></div>
    ${years[y].map(i=>`<button class="row" data-act="doc" data-v="${i.id}"><span class="who">${esc(i.client.name||"No client")}</span><span class="amt">${money(amt(i))}</span>
    <span class="meta">${esc(i.number)}${!isQ&&i._s==="part"?` · ${money(i._t.due)} left`:""}</span>${right(i)}</button>`).join("")}`).join("")
    :`<div class="empty">${isQ?"No quotes here. Tap <b>New quote</b> to price up a job.":f==="owed"?"Nothing outstanding. Everyone has paid.":"No invoices here."}</div>`}</div>`;
  fab(isQ?"+ New quote":"+ New invoice", isQ?"new-quote":"new-invoice");
  app.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{ui[key]=b.dataset.f;render();});
  $("#doc-q").oninput=e=>{ ui.q=e.target.value; const p=e.target.selectionStart; render(); const q=$("#doc-q"); q.focus(); q.setSelectionRange(p,p); };
}

async function makePdf(inv,btn,share=false){
  if(!window.html2canvas||!window.jspdf){ toast("The PDF maker didn't load. Check your connection and reopen the app."); return; }
  const label=btn.textContent; btn.disabled=true; btn.textContent="Making PDF…";
  try{
    const host=$("#pdfHost"); host.innerHTML=sheetHTML(inv);
    try{ await document.fonts.load('500 14px "Inter"'); await document.fonts.load('600 18px "Inter"'); await document.fonts.ready; }catch(e){}
    const sheet=host.firstElementChild;
    await Promise.all([...sheet.querySelectorAll("img")].map(im=>im.complete?0:new Promise(r=>{im.onload=im.onerror=r;})));
    const top=sheet.getBoundingClientRect().top;
    const breaks=[...sheet.querySelectorAll(".brk")].map(el=>Math.ceil(el.getBoundingClientRect().bottom-top));
    const SC=2, PH=1056, M=40, H=sheet.scrollHeight;
    const canvas=await html2canvas(sheet,{scale:SC,backgroundColor:"#ffffff",logging:false});
    const pdf=new jspdf.jsPDF({unit:"pt",format:"letter",compress:true});
    const pw=pdf.internal.pageSize.getWidth(), k=pw/816;
    // trim empty space at the bottom so a short invoice stays on one page
    const contentEnd=Math.max(...breaks);
    let start=0, page=0;
    while(start < contentEnd-2){
      const room = page===0 ? PH : PH-M;
      let end = start+room;
      if(end < contentEnd){ const fit=breaks.filter(b=>b>start+40 && b<=end); if(fit.length) end=Math.max(...fit); }
      else end=Math.min(H, start+room);
      const sh=end-start, c=document.createElement("canvas"); c.width=canvas.width; c.height=Math.ceil(sh*SC);
      const g=c.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,c.width,c.height); g.drawImage(canvas,0,-start*SC);
      if(page>0) pdf.addPage();
      pdf.addImage(c.toDataURL("image/png"),"PNG",0,(page===0?0:M)*k,pw,sh*k);
      start=end; page++;
    }
    host.innerHTML="";
    const fname=`${inv.number} ${inv.client?.name||""}`.trim().replace(/[\\/:*?"<>|]+/g,"")+".pdf", blob=pdf.output("blob");
    return share ? await shareFile(fname,blob) : await saveFile(fname,blob);
  }catch(e){ toast("Couldn't make the PDF: "+(e?.message||"unknown error")); return false; }
  finally{ btn.disabled=false; btn.textContent=label; }
}

function chartSVG(Y){
  const qs=quartersOf(Y), months=[];
  for(let i=0;i<12;i++){ const d=new Date(Y,3+i,1); months.push({y:d.getFullYear(),m:d.getMonth()}); }
  const start=qs[0].start, end=qs[3].end;
  const key=iso=>iso.slice(0,7);
  const inc={}, out={};
  allPayments().filter(p=>p.date>=start&&p.date<=end).forEach(p=>inc[key(p.date)]=(inc[key(p.date)]||0)+p.amount);
  allExpenses().filter(e=>e.date>=start&&e.date<=end).forEach(e=>out[key(e.date)]=(out[key(e.date)]||0)+e.amount);
  const data=months.map(({y,m})=>{ const k=`${y}-${String(m+1).padStart(2,"0")}`; return {k,label:new Date(y,m,1).toLocaleDateString("en-GB",{month:"short"}).slice(0,3),i:inc[k]||0,o:out[k]||0}; });
  const max=Math.max(1,...data.map(d=>Math.max(d.i,d.o)));
  const step=[500,1000,2000,2500,5000,10000,20000].find(s=>max/s<=4)||Math.ceil(max/4/1000)*1000;
  const top=Math.ceil(max/step)*step, W=640,H=210,L=44,B=24,T=8,cw=(W-L-6)/12, h=v=>(H-B-T)*v/top;
  let g=""; for(let v=0;v<=top;v+=step){ const y=H-B-h(v); g+=`<line x1="${L}" x2="${W-4}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v>=1000?(v/1000)+"k":v}</text>`; }
  const bars=data.map((d,i)=>{ const x=L+i*cw+cw*0.14, bw=cw*0.34;
    return `<rect x="${x}" y="${H-B-h(d.i)}" width="${bw}" height="${h(d.i)}" rx="2" fill="var(--bar-in)"><title>${d.label}: income ${money(d.i)}</title></rect>

    <text x="${L+i*cw+cw/2}" y="${H-7}" text-anchor="middle" font-size="11" fill="var(--muted)">${d.label}</text>`; }).join("");
  return `<div class="chart"><div class="legend"><span><i style="background:var(--bar-in)"></i>Income received</span><span><i style="background:var(--bar-out)"></i>Expenses</span></div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Monthly income and expenses for tax year ${tyLabel(Y)}">${g}${bars}</svg></div>`;
}

/* ---- Accounting pack: one Excel workbook per tax year ---- */
function buildPack(Y){
  const st=S.settings, qs=quartersOf(Y), start=qs[0].start, end=qs[3].end, today=todayISO();
  const qOf=iso=>{ const q=qs.find(q=>iso>=q.start&&iso<=q.end); return q?q.label:""; };
  const xd=iso=>{ if(!iso) return ""; const [y,m,d]=iso.split("-").map(Number); return new Date(y,m-1,d); };
  const GBP='"£"#,##0.00;[Red]-"£"#,##0.00', DATE="dd/mm/yyyy";
  function sheet(rows, cols, moneyCols, dateCols, headerRow){
    const ws=XLSX.utils.aoa_to_sheet(rows,{cellDates:true});
    const rg=XLSX.utils.decode_range(ws["!ref"]);
    for(let r=(headerRow??0)+1;r<=rg.e.r;r++){
      moneyCols.forEach(c=>{ const a=XLSX.utils.encode_cell({r,c}); if(ws[a]&&typeof ws[a].v==="number") ws[a].z=GBP; });
      dateCols.forEach(c=>{ const a=XLSX.utils.encode_cell({r,c}); if(ws[a]&&ws[a].t==="d") ws[a].z=DATE; });
    }
    ws["!cols"]=cols.map(w=>({wch:w}));
    if(headerRow!=null) ws["!autofilter"]={ref:XLSX.utils.encode_range({s:{r:headerRow,c:0},e:{r:rg.e.r,c:rg.e.c}})};
    return ws;
  }
  const wb=XLSX.utils.book_new();
  // Summary
  const figs=qs.map(q=>periodFigures(q.start,q.end)), yf=periodFigures(start,end);
  const owedNow=docs("invoice").filter(i=>i.status!=="draft").map(i=>({...i,_t:totals(i)})).filter(i=>i._t.due>0.004);
  const sum=[
    [`${st.bizName} – Accounting pack`],
    [`Tax year ${tyLabel(Y)}: ${ukDate(start)} to ${ukDate(end)}`],
    [`Prepared ${ukDate(today)} by ${st.owner}. Income is counted on the date money was received (cash basis).`],
    [],
    ["", ...qs.map(q=>`${q.label}: ${ukDate(q.start)}–${ukDate(q.end)}`), "Tax year"],
    ["Quarterly update due", ...qs.map(q=>xd(q.deadline)), ""],
    ["Turnover (income received)", ...figs.map(f=>f.income), yf.income],
    ["Other business income", 0,0,0,0,0],
    [],
    ["Expenses (HMRC category)"],
    ...CATS.map(([k,l])=>[l, ...figs.map(f=>f.byCat[k]||0), yf.byCat[k]||0]),
    ["Total expenses", ...figs.map(f=>f.spent), yf.spent],
    ["of which not allowable (entertaining)", ...figs.map(f=>f.byCat.businessEntertainmentCosts||0), yf.byCat.businessEntertainmentCosts||0],
    ["Allowable expenses", ...figs.map(f=>f.allowable), yf.allowable],
    [],
    ["Net profit", ...figs.map(f=>f.profit), yf.profit],
    [],
    ["Still owed by clients on "+ukDate(today), owedNow.reduce((a,i)=>a+i._t.due,0)],
    ["Invoices with a balance outstanding", owedNow.length],
    [],
    ["This pack is prepared from the business's own records. Please check it before submitting to HMRC."]
  ];
  const wsS=sheet(sum,[38,22,22,22,22,16],[1,2,3,4,5],[1,2,3,4],null);
  for(let c=1;c<=4;c++){ const a=XLSX.utils.encode_cell({r:5,c}); if(wsS[a]) wsS[a].z=DATE; }
  const cntRow=sum.findIndex(r=>r[0]==="Invoices with a balance outstanding"); const n=XLSX.utils.encode_cell({r:cntRow,c:1}); if(wsS[n]) wsS[n].z="0";
  XLSX.utils.book_append_sheet(wb,wsS,"Summary");
  // Payments received
  const pays=allPayments().filter(p=>p.date>=start&&p.date<=end).sort((a,b)=>a.date.localeCompare(b.date));
  const pr=[["Date received","Quarter","Invoice","Client","Method","Amount"],...pays.map(p=>[xd(p.date),qOf(p.date),p.number,p.client,p.method||"",p.amount]),[],["","","","","Total",pays.reduce((a,p)=>a+p.amount,0)]];
  XLSX.utils.book_append_sheet(wb,sheet(pr,[14,9,11,32,15,13],[5],[0],0),"Payments received");
  // Expenses
  const ex=allExpenses().filter(e=>e.date>=start&&e.date<=end).sort((a,b)=>a.date.localeCompare(b.date));
  const er=[["Date","Quarter","Supplier / description","Category","HMRC field","Paid by","For client","Notes","Amount","Receipt file"],
    ...ex.map(e=>[xd(e.date),qOf(e.date),e.supplier||"",CAT[e.category]||e.category,e.category,e.method||"",S.clients[e.clientId]?.name||"",e.notes||"",e.amount,(e.receipts||[]).map((r,k)=>receiptFileName(e,r,e.receipts.length>1?k+1:1)).join("; ")||"Not attached"]),[],["","","","","","","","Total",ex.reduce((a,e)=>a+e.amount,0)]];
  XLSX.utils.book_append_sheet(wb,sheet(er,[12,9,30,26,28,13,22,30,12,44],[8],[0],0),"Expenses");
  // Invoices raised in the year
  const inv=docs("invoice").filter(i=>i.status!=="draft"&&i.date>=start&&i.date<=end).map(i=>({...i,_t:totals(i),_s:statusOf(i)})).sort((a,b)=>a.date.localeCompare(b.date)||a.number.localeCompare(b.number));
  const ir=[["Invoice","Date","Client","Status","Subtotal","VAT","Total","Paid to date","Balance"],
    ...inv.map(i=>[i.number,xd(i.date),i.client.name,STATUS_LABEL[i._s],i._t.sub,i._t.vat,i._t.total,i._t.paid,i._t.due]),[],
    ["","","","Totals",inv.reduce((a,i)=>a+i._t.sub,0),inv.reduce((a,i)=>a+i._t.vat,0),inv.reduce((a,i)=>a+i._t.total,0),inv.reduce((a,i)=>a+i._t.paid,0),inv.reduce((a,i)=>a+i._t.due,0)]];
  XLSX.utils.book_append_sheet(wb,sheet(ir,[11,12,32,12,13,11,13,13,13],[4,5,6,7,8],[1],0),"Invoices raised");
  // Money owed now (all years)
  const od=owedNow.sort((a,b)=>a.date.localeCompare(b.date));
  const orows=[["Invoice","Date","Client","Phone","Total","Paid","Balance owed","Days since invoice"],
    ...od.map(i=>[i.number,xd(i.date),i.client.name,i.client.phone||"",i._t.total,i._t.paid,i._t.due,Math.round((Date.parse(today)-Date.parse(i.date))/864e5)]),[],
    ["","","","Total",od.reduce((a,i)=>a+i._t.total,0),od.reduce((a,i)=>a+i._t.paid,0),od.reduce((a,i)=>a+i._t.due,0)]];
  XLSX.utils.book_append_sheet(wb,sheet(orows,[11,12,32,16,13,13,14,10],[4,5,6],[1],0),"Owed to you");
  wb.Props={Title:`Accounting pack ${tyLabel(Y)}`,Author:st.owner,Company:st.bizName};
  return XLSX.write(wb,{bookType:"xlsx",type:"array",cellDates:true});
}
async function downloadPack(Y,btn){
  if(!window.XLSX){ toast("The spreadsheet maker didn't load. Check your connection and reopen the app."); return; }
  const label=btn.textContent; btn.disabled=true; btn.textContent="Building pack…";
  try{ const buf=buildPack(Y); await saveFile(`Accounting pack ${tyLabel(Y)} - ${S.settings.bizName}.xlsx`, new Blob([buf])); }
  catch(e){ toast("Couldn't build the pack: "+(e?.message||"unknown error")); }
  finally{ btn.disabled=false; btn.textContent=label; }
}
function yearCSV(Y){
  const qs=quartersOf(Y), figs=qs.map(q=>periodFigures(q.start,q.end)), yf=periodFigures(qs[0].start,qs[3].end);
  const rows=[[`${S.settings.bizName} – tax year ${tyLabel(Y)}`],[],["",...qs.map(q=>`${q.label} (${ukDate(q.start)}–${ukDate(q.end)})`),"Year"]];
  rows.push(["Turnover",...figs.map(f=>f.income.toFixed(2)),yf.income.toFixed(2)]);
  CATS.forEach(([k,l])=>rows.push([l,...figs.map(f=>(f.byCat[k]||0).toFixed(2)),(yf.byCat[k]||0).toFixed(2)]));
  rows.push(["Total expenses",...figs.map(f=>f.spent.toFixed(2)),yf.spent.toFixed(2)],["Net profit",...figs.map(f=>f.profit.toFixed(2)),yf.profit.toFixed(2)]);
  return csv(rows);
}

/* ---- receipts: store the file, then let Claude read it ---- */
function loadScript(src){ return new Promise((ok,no)=>{ if(document.querySelector(`script[src="${src}"]`)) return ok(); const t=document.createElement("script"); t.src=src; t.onload=ok; t.onerror=()=>no(new Error("Couldn't load "+src)); document.head.appendChild(t); }); }
async function pdfFirstPageImage(file){
  await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js");
  await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js");
  const lib=window.pdfjsLib; const doc=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
  const page=await doc.getPage(1); const vp=page.getViewport({scale:1}); const sc=Math.min(2.2,1800/Math.max(vp.width,vp.height));
  const v=page.getViewport({scale:sc}); const c=document.createElement("canvas"); c.width=Math.round(v.width); c.height=Math.round(v.height);
  const g=c.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,c.width,c.height);
  await page.render({canvasContext:g,viewport:v}).promise;
  return await new Promise(r=>c.toBlob(r,"image/jpeg",0.88));
}
async function shrinkImage(file,max=2000){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((ok,no)=>{ const i=new Image(); i.onload=()=>ok(i); i.onerror=()=>no(new Error("That photo couldn't be opened. Try a JPEG or PNG.")); i.src=url; });
    const k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)); const c=document.createElement("canvas");
    c.width=Math.round(img.naturalWidth*k); c.height=Math.round(img.naturalHeight*k);
    const g=c.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,c.width,c.height); g.drawImage(img,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(r,"image/jpeg",0.85));
  } finally { URL.revokeObjectURL(url); }
}
const ASSET_ERR={too_large:"That file is too big (20 MB limit).",unsupported_type:"That file type can't be stored. Use a photo or a PDF.",quota_or_state:"Receipt storage is full. Remove some old receipts first.",rate_limited:"Too many uploads at once. Wait a moment and try again.",not_granted:"Receipts can only be added from your own Claude account."};
async function addReceipt(file){
  const e=expDraft, st=()=>$("#rc-status"), say=t=>{ const el=st(); if(el) el.textContent=t; };
  if(!assets){ toast("Receipts can only be added from your own Claude account."); return; }
  const pdf=file.type==="application/pdf"||/\.pdf$/i.test(file.name);
  if(!pdf && !(file.type||"").startsWith("image/")){ toast("Choose a photo or a PDF."); return; }
  say("Saving receipt…");
  let stored, readImg;
  try{
    if(file.size>20*1024*1024){ say(""); toast("That file is too big (20 MB limit)."); return; }
    if(pdf){ stored=await uploadReceipt(file,"application/pdf",e.id); }
    else { const small=await shrinkImage(file); stored=await uploadReceipt(small,"image/jpeg",e.id); readImg=small; }
  }catch(err){ say(""); toast(ASSET_ERR[err?.code]||("Couldn't save the receipt: "+(err?.message||err?.code||"try again"))); return; }
  e.receipts.push({id:stored.id,path:stored.path,name:file.name||"Receipt",type:stored.contentType,size:stored.sizeBytes,added:new Date().toISOString()});
  // keep the expense and its file in step: if it was already saved, save the new receipt list straight away
  if(!e.isNew&&S.expenses[e.id]){ try{ await put("expenses",e.id,{...S.expenses[e.id],receipts:e.receipts}); }catch(x){} }
  rerenderKeep();
  if(!sampler){ say("Receipt attached. Fill in the details from it."); return; }
  say("Reading the receipt…");
  try{
    if(pdf) readImg=await pdfFirstPageImage(file);
    const cats=CATS.map(([k,l])=>`${k} = ${l}`).join("\n");
    const out=await sampler.json(`You are reading a receipt or supplier invoice for a UK painter and decorator (sole trader, not VAT registered).
Read the image and reply with only this JSON object:
{"isReceipt": true or false, "date": "YYYY-MM-DD" or null, "supplier": "shop or company name" or null, "total": number (the total actually paid, including VAT) or null, "vat": number or null, "items": "short summary of what was bought, max 12 words" or null, "category": one key from the list below}
Categories:
${cats}
Paint, filler, caulk, sundries, brushes and rollers are costOfGoods. Fuel and parking are travelCosts. Larger tools and equipment are otherExpenses.
UK dates are day/month/year. Use null for anything you cannot read clearly. Do not guess amounts.`,{images:[readImg],modelTier:"default"});
    if(!out||out.isReceipt===false){ say("This doesn't look like a receipt. Fill in the details yourself."); return; }
    const blank=v=>v===""||v==null;
    const fill=(k,v)=>{ if(v==null||v==="") return; if((e.isNew&&!(e._touched&&e._touched[k]))||blank(e[k])) e[k]=v; };
    if(out.date&&/^\d{4}-\d{2}-\d{2}$/.test(out.date)) fill("date",out.date);
    if(typeof out.total==="number"&&out.total>0) fill("amount",out.total.toFixed(2));
    if(out.supplier) fill("supplier",String(out.supplier).slice(0,80));
    if(out.category&&CAT[out.category]) fill("category",out.category);
    if(out.items&&blank(e.notes)) e.notes=String(out.items).slice(0,200)+(typeof out.vat==="number"&&out.vat>0?` (includes VAT ${money(out.vat)})`:"");
    rerenderKeep(); say("Details filled in from the receipt. Check them, then Save.");
  }catch(err){
    const m={not_granted:"Reading receipts needs your permission. Fill in the details yourself, or allow it next time.",rate_limited:"Claude is busy. Fill in the details yourself, or try another receipt shortly.",image_rejected:"That image couldn't be read. Fill in the details yourself.",sampling_disabled:"Reading receipts isn't available on this account. Fill in the details yourself."};
    say(m[err?.code]||"Couldn't read the receipt. Fill in the details yourself.");
  }
}

/* ---- receipts for the accountant: one ZIP per period ---- */
function receiptFileName(e,r,n){ const ext=isPdf(r)?"pdf":"jpg"; return `${e.date} ${(e.supplier||CAT[e.category]||"expense").replace(/[\\/:*?"<>|]+/g,"").slice(0,40)} £${(+e.amount).toFixed(2)}${n>1?` (${n})`:""}.${ext}`; }
async function downloadReceipts(start,end,label,btn){
  const list=allExpenses().filter(e=>e.date>=start&&e.date<=end&&e.receipts&&e.receipts.length).sort((a,b)=>a.date.localeCompare(b.date));
  if(!list.length){ toast("No receipts attached in this period yet."); return; }
  const lbl=btn.textContent; btn.disabled=true; btn.textContent="Collecting receipts…";
  try{
    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js");
    const zip=new JSZip(), used=new Set(); let n=0, failed=0;
    for(const e of list){ let k=0; for(const r of e.receipts){ k++;
      try{ const {data:blob,error}=await sb.storage.from(BUCKET).download(rcptPath(r)); if(error) throw error; const res={blob:async()=>blob}; let name=receiptFileName(e,r,e.receipts.length>1?k:1); while(used.has(name)) name=name.replace(/(\.\w+)$/," x$1"); used.add(name); zip.file(name,await res.blob()); n++; }catch(x){ failed++; } } }
    const blob=await zip.generateAsync({type:"blob"});
    await saveFile(`Receipts ${label} - ${S.settings.bizName}.zip`,blob);
    if(failed) toast(`${failed} receipt${failed>1?"s":""} couldn't be included.`);
  }catch(err){ toast("Couldn't build the receipts file: "+(err?.message||"try again")); }
  finally{ btn.disabled=false; btn.textContent=lbl; }
}
